apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-react
  labels:
    app.kubernetes.io/name: frontend-react
    app.kubernetes.io/part-of: agentic-workflow-hexagonal-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-react
  labels:
    app.kubernetes.io/name: frontend-react
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: agentic-workflow-hexagonal-platform
spec:
  selector:
    app.kubernetes.io/name: frontend-react
  ports:
    - name: http
      port: 5173
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-react
  labels:
    app.kubernetes.io/name: frontend-react
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: agentic-workflow-hexagonal-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-react
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-react
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: agentic-workflow-hexagonal-platform
    spec:
      serviceAccountName: frontend-react
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-react
      containers:
        - name: frontend-react
          image: agentic/frontend-react:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "5173" }
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef: { name: agentic-config, key: VITE_API_BASE_URL }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-react
  labels:
    app.kubernetes.io/name: frontend-react
    app.kubernetes.io/part-of: agentic-workflow-hexagonal-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-react
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-react
  labels:
    app.kubernetes.io/name: frontend-react
    app.kubernetes.io/part-of: agentic-workflow-hexagonal-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-react
